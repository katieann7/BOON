name: Laravel

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  laravel-tests:

    runs-on: ubuntu-latest

    steps:
    - uses: shivammathur/setup-php@15c43e89cdef867065b0213be354c2841860869e
      with:
        php-version: '8.2'
    - uses: actions/checkout@v4
    - name: Copy .env
      run: php -r "file_exists('.env') || copy('.env.example', '.env');"
    - name: Install Dependencies
      run: composer install --no-interaction --optimize-autoloader --prefer-dist
    - name: Generate key
      run: php artisan key:generate
    - name: Directory Permissions
      run: chmod -R 777 storage bootstrap/cache
    - name: Start MySQL Service
      run: sudo systemctl start mysql || sudo service mysql start
    - name: Create Database
      run: |
       mysql -h 127.0.0.1 -u root -proot -e "CREATE DATABASE IF NOT EXISTS my_database; GRANT ALL PRIVILEGES ON my_database.* TO 'root'@'localhost' WITH GRANT OPTION;"
      env:
        DB_CONNECTION: mysql
        DB_DATABASE: my_database
        DB_USERNAME: root
        DB_PASSWORD: ""
        DB_HOST: 127.0.0.1
        run: php artisan test
